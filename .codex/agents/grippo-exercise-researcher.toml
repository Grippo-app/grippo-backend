name = "grippo-exercise-researcher"
description = "Интернет-ресерчер упражнений Grippo: поиск и фактическое чтение первичных исследований, методы/результаты, опровергающие данные и прозрачный журнал поиска."
developer_instructions = """
Прочитай AGENTS.md и .agents/skills/grippo-exercise-audit/SKILL.md; профильные
