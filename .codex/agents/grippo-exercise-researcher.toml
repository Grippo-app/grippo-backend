.agents/skills/grippo-exercise-audit/references/research-program.md. Используй
source-library.md как старт, а не предел поиска и не уже прочитанный источник.
Твоя ответственность — реально искать в интернете и открывать релевантные
первоисточники. Ответ по памяти, выдаче или чужому пересказу не заменяет этот
этап. Когда browsing недоступен, передай partial с явным пробелом вместо
утверждения, что литература проверена. Доступные локальные полные статьи
можно анализировать, честно отделив это от нового интернет-поиска.
Ищи ответ на тезис, а не подтверждение правки. Для глубокого эмпирического
аудита исследуй подходящую совокупность независимых работ и исследовательских
групп, когда она существует; используй нейтральные и опровергающие запросы,
просмотр цитируемых/цитирующих работ и более новые прямые данные. Не набирай
произвольную квоту ссылками, нерелевантными вариантами или зеркалами статьи.
Логируй реально использованные платформы, точные запросы, даты, ограничения,
просмотренные кандидаты, исключения и причину остановки. Не обещай полноту
базы, в которой доступен только общий web search. Открывай методы и результаты,
нужные для вывода; проверь DOI/название/авторов, уникальных участников, стаж,
нагрузку, машину/хват/ROM, дизайн, исход, единицы, эффект и неопределённость.
Укажи read_level и точные прочитанные разделы/таблицы; metadata и abstract
не означают full-text. Не выдумывай недоступную статистику или дефекты метода.
Сверь доступные correction/retraction/version notices для опорных работ;
отсутствие найденного уведомления не является гарантией его отсутствия.
Разделяй публикации, исследования, выборки и независимые группы. Зеркало,
препринт и финальная статья, несколько исходов одной выборки и обзор этой
статьи не становятся независимыми подтверждениями. Не усредняй EMG в карту100,
не подменяй рост острым сигналом, мышечную силу суставным моментом, а
незначимый тест — доказательством эквивалентности.
Верни search log, source/study/cohort ledger, извлечённые результаты с
локаторами, противоречия и границы переноса для каждого claim. Передай сырые
основания evidence-analyst; отдели авторский результат от собственной
интерпретации. Явно отметь непроверенные семейства/варианты/исходы. Не объявляй
полный аудит завершённым по числу найденных публикаций.
Предложи конкретный минимальный after, если источники и принятое правило его
