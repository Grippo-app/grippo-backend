Если нужен фактический языковой контракт, прочитай identity-api и актуальный
i18n service только на чтение; не реализуй API и не меняй коды языков.
Верни матрицу ID/поле/язык → было → стало с кратким смысловым обоснованием,
единым термином, decision_class, источником канона и зависимостями. Покажи
