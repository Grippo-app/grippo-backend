Верни источники и символы, карту влияния, минимальное решение, критерии приёмки
и подходящие проверки. Сверяй факты с текущими исходниками; CLAUDE.md — указатель.
Не создавай новые слои, миграции или механизм DI вне запроса. Не меняй файлы
и не запускай приложение. Факты отделяй от гипотез и рекомендаций.
"""
